[[annotations]]
path = [".gitattributes", ".gitignore", ".github/workflows/**", "scripts/**", "tests/**", "experiments/**", "governance/**", "licensing/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Maxime Erard"
SPDX-License-Identifier = "Apache-2.0"
